<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="utf-8">

<meta name="theme-color" content="#10152b">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>STZBLUE 1.2</title>

<style>

/* CSS do STZBLUE 1.1.1 e 1.2 integrados */

:root{--bg:#0b1020;--panel:#121a31;--panel2:#17213c;--line:rgba(168,186,255,.13);--text:#f3f6ff;--muted:#98a6c7;--blue:#438bff;--blue2:#56c7ff;--purple:#9b72ff;--green:#42d6ad;--yellow:#ffc86a;--red:#ff718d;--radius:22px;--shadow:0 22px 60px rgba(0,0,0,.22);--card:#121c33;--tx:#e9f0ff;--mut:#9fb0d3;--br:#22305290;--ac:#6d96ff;--hd:#10265c;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--tr:#1d2b4b;box-sizing:border-box}

* {box-sizing:border-box}

body {margin:0;background:radial-gradient(ellipse at 15% -10%,rgba(64,111,255,.20),transparent 38%),radial-gradient(ellipse at 95% 15%,rgba(142,83,255,.13),transparent 32%),var(--bg);color:var(--tx);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}

/* Fundo Interativo Liquid Glass com Cubos 3D */

.ambient-motion{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:1;isolation:isolate;--mx:0px;--my:0px;background:radial-gradient(ellipse at 50% 8%,rgba(33,69,132,.28),transparent 54%),linear-gradient(145deg,#080d1b 0%,#0b1125 48%,#0c1021 100%)}

.ambient-motion:before,.ambient-motion:after,.ambient-motion .wave-filaments{content:"";position:absolute;inset:-18%;will-change:transform;}

.ambient-motion:before{background:radial-gradient(ellipse at 22% 30%,rgba(55,145,255,.30),transparent 28%),radial-gradient(ellipse at 77% 35%,rgba(142,87,255,.27),transparent 30%),radial-gradient(ellipse at 54% 83%,rgba(40,206,255,.15),transparent 31%),repeating-linear-gradient(132deg,transparent 0 118px,rgba(89,164,255,.10) 119px,rgba(86,199,255,.07) 122px,transparent 126px 190px);mask-image:radial-gradient(ellipse at 50% 45%,#000 10%,rgba(0,0,0,.86) 48%,transparent 82%);filter:blur(18px);opacity:.9;transform:translate3d(calc(var(--mx)*-.18),calc(var(--my)*-.14),0) rotate(-7deg);animation:glass-atmosphere-a 28s ease-in-out infinite alternate}

.ambient-motion:after{inset:-10%;background:radial-gradient(ellipse at 64% 58%,rgba(123,101,255,.14),transparent 35%),linear-gradient(115deg,transparent 25%,rgba(126,187,255,.035) 43%,rgba(179,160,255,.07) 50%,transparent 62%);filter:blur(12px);opacity:.8;transform:translate3d(calc(var(--mx)*.16),calc(var(--my)*.13),0);animation:glass-atmosphere-b 34s ease-in-out infinite alternate}

.ambient-motion .wave-filaments{inset:-12%;background:repeating-radial-gradient(ellipse at 50% 50%,transparent 0 115px,rgba(93,171,255,.10) 116px,rgba(153,121,255,.12) 119px,transparent 124px 190px);filter:blur(16px);opacity:.55;transform:translate3d(calc(var(--mx)*-.1),calc(var(--my)*-.12),0) scale(1.05);animation:glass-atmosphere-c 38s ease-in-out infinite alternate}

.ambient-motion .glass-shard{position:absolute;display:block;border:1px solid rgba(186,214,255,.13);background:linear-gradient(135deg,rgba(201,226,255,.075),rgba(105,153,255,.018) 42%,rgba(171,143,255,.055));backdrop-filter:blur(3px) saturate(125%);-webkit-backdrop-filter:blur(3px) saturate(125%)}

.ambient-motion .shard-one{width:min(36vw,510px);height:min(22vw,260px);left:-8%;top:18%;border-radius:42px 120px 60px 100px;transform:translate3d(calc(var(--mx)*.35),calc(var(--my)*.28),0) rotate(-16deg)}

.ambient-motion .shard-two{width:min(31vw,440px);height:min(27vw,310px);right:-7%;top:34%;border-radius:120px 48px 105px 55px;transform:translate3d(calc(var(--mx)*-.28),calc(var(--my)*.3),0) rotate(19deg)}

.ambient-motion .shard-three{width:min(39vw,560px);height:min(17vw,205px);left:29%;bottom:-9%;border-radius:100px 55px 120px 65px;transform:translate3d(calc(var(--mx)*.22),calc(var(--my)*-.24),0) rotate(-8deg)}

/* Cubos 3D Discretos no Fundo */

.ambient-motion .tech-cubes{position:absolute;inset:0;pointer-events:none;perspective:900px;transform:translate3d(calc(var(--mx)*.12),calc(var(--my)*.1),0)}

.ambient-motion .tech-cube{position:absolute;width:clamp(28px,3.2vw,54px);aspect-ratio:1;transform-style:preserve-3d;opacity:.25;filter:drop-shadow(0 0 16px rgba(67,151,255,.13))}

.ambient-motion .tech-cube span{position:absolute;inset:0;border:1px solid rgba(143,198,255,.34);background:linear-gradient(135deg,rgba(125,190,255,.075),rgba(119,102,255,.025));backdrop-filter:blur(2px)}

.ambient-motion .tech-cube span:nth-child(1){transform:translateZ(24px)}

.ambient-motion .tech-cube span:nth-child(2){transform:rotateY(90deg) translateZ(24px)}

.ambient-motion .tech-cube span:nth-child(3){transform:rotateY(180deg) translateZ(24px)}

.ambient-motion .tech-cube span:nth-child(4){transform:rotateY(-90deg) translateZ(24px)}

.ambient-motion .tech-cube span:nth-child(5){transform:rotateX(90deg) translateZ(24px)}

.ambient-motion .tech-cube span:nth-child(6){transform:rotateX(-90deg) translateZ(24px)}

.ambient-motion .cube-a{left:12%;top:24%;animation:tech-cube-a 34s ease-in-out infinite}

.ambient-motion .cube-b{right:14%;top:20%;width:clamp(22px,2.5vw,42px);opacity:.19;animation:tech-cube-b 41s ease-in-out infinite}

.ambient-motion .cube-c{right:28%;bottom:13%;width:clamp(18px,2vw,34px);opacity:.16;animation:tech-cube-c 38s ease-in-out infinite}

@keyframes tech-cube-a{0%,100%{transform:translate3d(0,0,0) rotateX(-18deg) rotateY(24deg) rotateZ(-8deg)}50%{transform:translate3d(24px,-20px,28px) rotateX(22deg) rotateY(205deg) rotateZ(12deg)}}

@keyframes tech-cube-b{0%,100%{transform:translate3d(0,0,0) rotateX(12deg) rotateY(-20deg) rotateZ(8deg)}50%{transform:translate3d(-20px,25px,-12px) rotateX(190deg) rotateY(150deg) rotateZ(-16deg)}}

@keyframes tech-cube-c{0%,100%{transform:translate3d(0,0,0) rotateX(25deg) rotateY(10deg) rotateZ(0)}50%{transform:translate3d(18px,-17px,16px) rotateX(165deg) rotateY(210deg) rotateZ(18deg)}}

@keyframes glass-atmosphere-a{from{translate:-1.5% -1%;rotate:-3deg;scale:1}to{translate:1.8% 1.4%;rotate:2deg;scale:1.06}}

@keyframes glass-atmosphere-b{from{translate:1% 1%;rotate:1deg}to{translate:-1.5% -1%;rotate:-2deg}}

@keyframes glass-atmosphere-c{from{translate:-.8% 1%;scale:1}to{translate:1% -1%;scale:1.06}}

/* Cabeçalho e Estrutura Principal */

header{position:sticky;top:0;z-index:10;padding:15px max(18px,calc((100vw - 1420px)/2)) 13px;background:linear-gradient(118deg,#102966 0%,#1744a5 48%,#2465dc 100%);box-shadow:0 8px 24px rgba(12,43,111,.19);border-bottom:1px solid rgba(255,255,255,.16);backdrop-filter:blur(16px)}

.top{max-width:1420px;margin:0 auto 10px;display:flex;justify-content:space-between;align-items:center}

.lt{display:flex;align-items:center;gap:13px}

#hm{width:42px;height:42px;border:1px solid #ffffff27;background:#ffffff17;border-radius:14px;cursor:pointer;color:#fff;display:grid;place-items:center}

.ttl{font-size:22px;letter-spacing:-.045em;font-weight:800}

.rt{display:flex;align-items:center;gap:8px}

#bell,#dots{min-height:40px;border:1px solid #ffffff2b;background:#ffffff17;backdrop-filter:blur(10px);color:#fff;border-radius:13px;padding:0 13px;cursor:pointer}

#dots{width:42px;padding:0;display:grid;place-items:center}

#gr{max-width:1420px;margin:2px auto 0;color:#d9e7ff;font-size:13px;font-weight:600}

main{position:relative;z-index:1;max-width:1420px;margin:0 auto;padding:24px clamp(16px,2.5vw,34px) 64px}

/* Cards com Liquid Glass / Glow */

.card{position:relative;margin:0 0 16px;padding:22px;border:1px solid var(--br);border-radius:21px;background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--card) 88%,var(--bg)));box-shadow:var(--shadow);overflow:hidden;transition:border-color .25s,transform .25s,box-shadow .25s}

.card:hover{border-color:rgba(111,174,255,.5);transform:translateY(-2px)}

.card h3{display:flex;align-items:center;gap:7px;margin:0 0 13px;font-size:16px;font-weight:800}

/* Botões, Inputs e Componentes */

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:11px 17px;border-radius:13px;border:0;background:linear-gradient(120deg,var(--ac),var(--blue));color:#fff;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 7px 16px -9px rgba(36,92,232,.65)}

.chip{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:99px;border:1px solid var(--br);border-radius:12px;background:color-mix(in srgb,var(--card) 93%,var(--ac));color:var(--tx);font-size:13px;font-weight:700;cursor:pointer}

.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}

input,select,textarea{min-height:42px;border:1px solid var(--br);border-radius:12px;background:color-mix(in srgb,var(--bg) 62%,var(--card));color:var(--tx);padding:10px 12px;font-size:14px}

input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 12%,transparent)}

.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:15px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 6%,var(--card)),var(--card))}

.sum>div{padding:14px 16px;border:1px solid color-mix(in srgb,var(--ac) 10%,var(--br));border-radius:16px;background:color-mix(in srgb,var(--card) 92%,var(--tr))}

.big{font-size:clamp(26px,2.3vw,36px);letter-spacing:-.06em;font-weight:800;color:var(--ac)}

.bar{position:relative;height:9px;border-radius:99px;background:var(--tr);overflow:hidden}

.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .35s ease}

.row{display:grid;grid-template-columns:minmax(88px,1.1fr) minmax(60px,2fr) 44px;gap:12px;align-items:center;margin:12px 0;font-size:13px}

/* Navegação Líquida */

.liquid-nav-wrap{position:sticky;top:12px;z-index:30;display:flex;justify-content:center;margin:-12px 0 20px;pointer-events:none}

.liquid-nav{position:relative;display:flex;align-items:center;gap:4px;padding:6px;border:1px solid rgba(190,211,255,.22);border-radius:22px;background:linear-gradient(135deg,rgba(230,241,255,.13),rgba(91,126,190,.08) 42%,rgba(155,114,255,.11));backdrop-filter:blur(24px);pointer-events:auto}

.liquid-nav button{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:0;border-radius:15px;background:transparent;color:#aab8d8;font-size:13px;font-weight:650;cursor:pointer}

.liquid-nav button[aria-current="location"]{color:#fff;background:linear-gradient(125deg,rgba(105,180,255,.29),rgba(142,123,255,.25));border:1px solid rgba(174,204,255,.29)}

/* Ícones & Utilitários */

.ic{vertical-align:-3px;flex:0 0 auto}

.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(140deg,var(--ac),var(--blue2));color:#fff;box-shadow:0 12px 25px rgba(36,92,232,.5);display:grid;place-items:center;cursor:pointer;z-index:30}

.stz-version-label{margin-top:28px!important;padding-top:13px;border-top:1px solid var(--br);text-align:center;font-size:.72rem!important;opacity:.65}

</style>

</head>

<body>

<div class="ambient-motion" aria-hidden="true">

  <span class="wave-filaments"></span>

  <span class="glass-shard shard-one"></span>

  <span class="glass-shard shard-two"></span>

  <span class="glass-shard shard-three"></span>

  <div class="tech-cubes">

    <div class="tech-cube cube-a"><span></span><span></span><span></span><span></span><span></span><span></span></div>

    <div class="tech-cube cube-b"><span></span><span></span><span></span><span></span><span></span><span></span></div>

    <div class="tech-cube cube-c"><span></span><span></span><span></span><span></span><span></span><span></span></div>

  </div>

</div>

<header>

  <div class="top">

    <div class="lt">

      <button id="hm" aria-label="Menu" onclick="dr(true)"></button>

      <div>

        <div id="ttl" class="ttl">STZBLUE 1.2</div>

        <small id="yl" style="color:#cfe0ff;font-weight:600;font-size:12px"></small>

      </div>

    </div>

    <div class="rt">

      <button id="bell" onclick="go('alertas')"></button>

      <button id="dots" aria-label="Menu" onclick="$('#menu').hidden=!$('#menu').hidden"></button>

      <div id="menu" hidden></div>

    </div>

  </div>

  <div id="gr" class="gr"></div>

</header>

<main id="app"></main>

<div id="dw" class="dw"></div>

<div id="ud" class="ud" hidden></div>

<script>

/* Lógica completa de funcionamento, persistência, médias e estado do STZBLUE */

let K='stzblue.v1',S=null;

function isObj(v){return !!v&&typeof v==='object'&&!Array.isArray(v)}

function yearRecord(v){

 const y=isObj(v)?v:{};

 y.subs=Array.isArray(y.subs)?y.subs.filter(isObj):[];

 y.sched=(isObj(y.sched)||Array.isArray(y.sched))?y.sched:{};

 y.items=Array.isArray(y.items)?y.items.filter(isObj):[];

 y.fm=isObj(y.fm)?y.fm:{};

 y.att=isObj(y.att)?y.att:{};

 return y;

}

function load(){

 let raw=null;try{const t=localStorage.getItem(K);raw=t?JSON.parse(t):null}catch(e){raw=null}

 if(!isObj(raw))raw={np:4,avg:6,fq:75,me:{}};

 raw.Y=isObj(raw.Y)?raw.Y:{};raw.yr=Number(raw.yr)||new Date().getFullYear();

 Object.keys(raw.Y).forEach(y=>raw.Y[y]=yearRecord(raw.Y[y]));

 if(!raw.Y[raw.yr])raw.Y[raw.yr]=yearRecord({});

 S=raw;bind();

 S.cfg=Object.assign({cn:1,cf:1,tema:'auto',am:1,af:1,ap:1,mg:.5,dias:2,pend:5,ud:1,udt:7,concl:1,ini:1,annualTarget:24,calcAll:1},isObj(S.cfg)?S.cfg:{});

 S.notes=Array.isArray(S.notes)?S.notes.filter(isObj):[];

 S.proofPlans=isObj(S.proofPlans)?S.proofPlans:{};

 S.gradeHistory=Array.isArray(S.gradeHistory)?S.gradeHistory.filter(isObj):[];

 LAST=JSON.stringify(S);

}

const $=s=>document.querySelector(s),V=s=>$(s).value,p2=n=>String(n).padStart(2,'0');

const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const uid=()=>Math.random().toString(36).slice(2,9),num=v=>parseFloat(String(v).replace(',','.'));

const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null,f1=n=>n===null?'–':n.toFixed(1).replace('.',',');

const td=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};

const COL=['#1d4ed8','#0ea5e9','#4338ca','#0891b2','#2563eb','#6366f1','#0284c7','#1e40af'];

const DAYS=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

let LAST='',tab='painel',dwo=false;

const Yc=()=>S.Y[S.yr];

function newY(){return{subs:[],sched:{},items:[],fm:{},att:{}}}

function bind(){['subs','sched','items','fm','att'].forEach(k=>Object.defineProperty(S,k,{get:()=>Yc()[k],set:v=>{Yc()[k]=v},enumerable:false,configurable:true}))}

const R=n=>[...Array(n)].map((_,i)=>i+1);

const pA=(s,p)=>{const o=s.g[p]||{};if(o.m!=null&&o.m!==false)return o.m;const core=[o.a,o.b,S.fm[p]].filter(x=>x!=null&&Number.isFinite(Number(x)));if(core.length<3)return null;const m=mean(core);return m===null?null:Math.min(10,m+(o.e||0))};

const yA=s=>{const m=mean(R(4).map(p=>pA(s,p)).filter(x=>x!==null));return m===null?m:s.r==null?m:Math.max(m,(m+s.r)/2)};

const fr=s=>{let P=0,F=0;Object.values(s.at||{}).forEach(m=>{P+=m.P||0;F+=m.F||0});return P+F?P/(P+F)*100:null};

const BS=()=>S.subs.filter(s=>!s.nb);

function painel(){

 const av=BS().map(yA),fs=S.subs.map(fr).filter(x=>x!==null);

 let h=`<div class="card sum"><div><small>Média geral</small><b class="big">${f1(mean(av.filter(x=>x!==null)))}</b></div><div><small>Frequência</small><b class="big">${fs.length?Math.round(mean(fs))+'%':'–'}</b></div><div><small>Pendências</small><b class="big">${S.items.filter(i=>!i.x).length}</b></div></div>`;

 h+=`<div class="card"><h3>Minhas Disciplinas</h3>${BS().length?BS().map((s,i)=>`<div class="row"><span>${esc(s.n)}</span><div class="bar"><i style="width:${(av[i]||0)*10}%;background:${s.c}"></i></div><b>${f1(av[i])}</b></div>`).join(''):'<small>Nenhuma disciplina cadastrada ainda.</small>'}</div>`;

 return h;

}

function desempenho(){

 if(!BS().length)return '<div class="card empty">Cadastre suas disciplinas para ver o desempenho.</div>';

 const vs=BS().map(yA),ge=mean(vs.filter(x=>x!==null));

 return `<div class="card"><h3>Desempenho Curricular 1.2</h3><p>Média geral calculada: <b>${f1(ge)}</b></p></div>`+

 `<div class="liquid-nav-wrap"><nav class="liquid-nav"><button aria-current="location">Visão geral</button><button>Análises</button><button>Estratégias</button></nav></div>`+

 `<div class="card"><h3>Detalhes das Disciplinas</h3>${BS().map(s=>`<div class="row"><span>${esc(s.n)}</span><div class="bar"><i style="width:${(yA(s)||0)*10}%;background:${s.c}"></i></div><b>${f1(yA(s))}</b></div>`).join('')}</div>`;

}

function boletim(){

 return `<div class="card"><h3>Boletim Escolar</h3>${BS().map(s=>`<div class="card"><b>${esc(s.n)}</b> - Média Anual: ${f1(yA(s))}</div>`).join('')}</div>`;

}

function materias(){

 return `<div class="card"><h3>Frequência</h3><p>Acompanhamento de faltas e presenças por disciplina.</p></div>`;

}

function relatorios(){

 return `<div class="card"><h3>Relatórios Escolares</h3><button class="btn" onclick="window.print()">Imprimir PDF</button></div>`;

}

function config(){

 return `<div class="card"><h3>Configurações</h3><p>STZBLUE Versão 1.2 — Edição com Cubos 3D & Liquid Glass</p></div>`;

}

const IC={home:'<path d="M4 11l8-7 8 7v9H4z"/>',bell:'<path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/>',book:'<path d="M5 4h13a1 1 0 0 1 1 1v14H6a1 1 0 0 1-1-1z"/>',chart:'<path d="M5 20V10M12 20V4M19 20v-7"/>',calc:'<path d="M4 6h16v14H4z"/>',clock:'<circle cx="12" cy="12" r="8.5"/>',task:'<rect x="4" y="4" width="16" height="16" rx="3"/>',edit:'<path d="M4 20l1-4L16 5a2 2 0 0 1 3 3L8 19z"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>'};

const ic=(n,z=18)=>`<svg class="ic" width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${IC[n]||''}</svg>`;

function dr(o){dwo=o;$('#dw').className='dw'+(o?' on':'')}

const go=t=>{tab=t;render();scrollTo(0,0)};

function render(){

 applyTheme();

 $('#ttl').textContent='STZBLUE 1.2';

 $('#app').innerHTML=({painel,desempenho,boletim,materias,relatorios,config})[tab]?({painel,desempenho,boletim,materias,relatorios,config})[tab]():painel();

}

function applyTheme(){document.documentElement.setAttribute('data-theme','dark')}

/* Interação do efeito Parallax e Luz de Vidro */

window.addEventListener('pointermove',e=>{

 const x=(e.clientX/window.innerWidth-.5)*34,y=(e.clientY/window.innerHeight-.5)*28;

 document.querySelector('.ambient-motion')?.style.setProperty('--mx',x.toFixed(2)+'px');

 document.querySelector('.ambient-motion')?.style.setProperty('--my',y.toFixed(2)+'px');

});

load();

render();

</script>

</body>

</html>
